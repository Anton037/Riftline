# Explicit release/device checks; no nightly compute bill and no repeat of these on every CSS edit.
name: Optional verification
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Check group
        type: choice
        default: visual
        options: [visual, equipment, combat, audio, audio-budget, render]
permissions:
  contents: read
concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 runners include Chrome runtime libraries; avoid redundant apt/font downloads.
      - run: npx playwright install --only-shell chromium
      - name: Run chosen checks
        env:
          CHECK_SUITE: ${{ inputs.suite }}
        run: |
          case "$CHECK_SUITE" in
            visual) npm run audit:visual ;;
            equipment) node tools/verify.js equipment current ;;
            combat) npm run verify:combat ;;
            audio) npm run verify:audio ;;
            audio-budget) npm run verify:audio-budget ;;
            render) npm run test:render ;;
            *) exit 2 ;;
          esac
      - name: Keep visual review images and metrics
        if: always() && (inputs.suite == 'visual' || inputs.suite == 'equipment' || inputs.suite == 'combat')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-review-${{ github.run_id }}
          path: verification-output/
          if-no-files-found: warn
          retention-days: 7
